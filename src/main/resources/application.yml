server:
  port: 8080
spring:
  application:
    name: be-tutorial-repo
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:app;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl: PT15M
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
